<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">antigravity-cli-setup logo: a sphere whose top half lifts away from its base</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8F7CFF"/>
      <stop offset="1" stop-color="#4B3FD1"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF2E6"/>
      <stop offset="1" stop-color="#2FB8C9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#14163A"/>
  <!-- lifted top half -->
  <path d="M146 232a110 110 0 0 1 220 0z" fill="url(#cap)"/>
  <!-- lift marks -->
  <path d="M206 168v-34M256 148v-52M306 168v-34" stroke="#7DF2E6" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  <!-- base half -->
  <path d="M146 290a110 110 0 0 0 220 0z" fill="url(#base)"/>
  <!-- ground shadow -->
  <ellipse cx="256" cy="430" rx="74" ry="9" fill="#000" opacity=".35"/>
</svg>
